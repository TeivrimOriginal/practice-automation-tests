name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  chrome:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: pip install -r requirements.txt
      # `py -3` is the Windows Python launcher and does not exist here; on a
      # Linux runner the interpreter set up above is just `python`.
      - run: python -m pytest -q --alluredir=allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: shots
