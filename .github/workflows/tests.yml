name: tests

# This suite drives a live third-party site — practice-automation.com — with a
# real headless Chrome. That is the point of the assignment, and it is also why
# this job is `continue-on-error`.
#
# The site sits behind a browser check. From a GitHub runner every page comes
# back as a "Checking your browser" interstitial, so all 40 tests fail on
# assertions about elements that were never rendered. That is the environment
# talking, not the tests, and there is nothing to fix in the test code.
#
# So: the run still happens and still uploads allure-results and screenshots,
# which makes it useful for a local regression check and for reading what the
# site actually served. It just does not gate the branch. Flip `continue-on-error`
# off if you have a way of reaching the site from a runner (a self-hosted label,
# or the site owner allow-listing GitHub's egress ranges).

on:
  push:
  pull_request:
  schedule:
    - cron: "0 8 * * 1"

jobs:
  chrome:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      - run: pip install -r requirements.txt
      # `py -3` is the Windows Python launcher and does not exist here; on a
      # Linux runner the interpreter set up above is just `python`.
      - run: python -m pytest -q --alluredir=allure-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: allure-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: shots
